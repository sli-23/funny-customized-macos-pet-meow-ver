<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ClaudeMeowPet - Settings</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #eee;
            padding: 0;
            font-size: 13px;
            min-height: 100vh;
        }
        .header {
            background: rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header img {
            width: 32px;
            height: 32px;
            image-rendering: pixelated;
        }
        .header h1 {
            font-size: 16px;
            font-weight: 700;
            background: linear-gradient(90deg, #e94560, #ff8a5c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .version {
            font-size: 10px;
            color: #666;
            margin-left: auto;
        }
        .content {
            padding: 20px 24px;
        }
        .section {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 14px;
        }
        .section-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #e94560;
            margin-bottom: 12px;
            font-weight: 700;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-weight: 500;
            margin-bottom: 4px;
            color: #aaa;
            font-size: 11px;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            background: rgba(0,0,0,0.3);
            color: #eee;
            font-size: 12px;
            font-family: 'SF Mono', monospace;
            transition: border-color 0.2s;
        }
        textarea {
            height: 90px;
            resize: vertical;
        }
        select { cursor: pointer; }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #e94560;
            box-shadow: 0 0 0 2px rgba(233,69,96,0.15);
        }
        input[type="range"] {
            -webkit-appearance: none;
            height: 4px;
            border-radius: 2px;
            background: rgba(255,255,255,0.1);
            border: none;
            padding: 0;
            margin-top: 8px;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #e94560;
            cursor: pointer;
        }
        .row {
            display: flex;
            gap: 12px;
        }
        .row .form-group { flex: 1; }
        .toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
        }
        .toggle input[type="checkbox"] {
            width: 36px;
            height: 20px;
            -webkit-appearance: none;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            position: relative;
            cursor: pointer;
            transition: background 0.2s;
        }
        .toggle input[type="checkbox"]::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #888;
            transition: all 0.2s;
        }
        .toggle input[type="checkbox"]:checked {
            background: #e94560;
        }
        .toggle input[type="checkbox"]:checked::after {
            left: 18px;
            background: white;
        }
        .toggle label {
            margin: 0;
            cursor: pointer;
            font-size: 12px;
            color: #ccc;
        }
        .footer {
            padding: 0 24px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        button {
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            color: white;
            border: none;
            padding: 10px 28px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 2px 8px rgba(233,69,96,0.3);
        }
        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(233,69,96,0.4);
        }
        button:active { transform: translateY(0); }
        .status {
            font-size: 12px;
            color: #4ecca3;
            min-height: 18px;
        }
        .interval-display {
            color: #ff8a5c;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="claude_meow.gif" alt="ClaudeMeowPet">
        <h1>ClaudeMeowPet</h1>
        <span class="version">v2.0</span>
    </div>

    <div class="content">
        <div class="section">
            <div class="section-title">AI Connection</div>
            <div class="row">
                <div class="form-group">
                    <label>AWS Region</label>
                    <select id="region">
                        <option value="us-east-1">us-east-1</option>
                        <option value="us-west-2">us-west-2</option>
                        <option value="eu-west-1">eu-west-1</option>
                        <option value="ap-northeast-1">ap-northeast-1</option>
                        <option value="ap-southeast-1">ap-southeast-1</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Bedrock Model ID</label>
                    <input type="text" id="modelId" placeholder="anthropic.claude-3-haiku-20240307-v1:0">
                </div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Personality</div>
            <div class="form-group">
                <label>Persona Prompt</label>
                <textarea id="persona" placeholder="Describe the pet's personality..."></textarea>
            </div>
            <div class="form-group">
                <label>Nicknames (comma separated)</label>
                <input type="text" id="nicknames" placeholder="KatMeow, Meow, 喵喵, 小猫, 晴晴">
            </div>
        </div>

        <div class="section">
            <div class="section-title">Behavior</div>
            <div class="form-group">
                <label>Message Interval: <span class="interval-display" id="intervalDisplay">5 min</span></label>
                <input type="range" id="interval" min="1" max="10" value="5">
            </div>
            <div class="toggle">
                <input type="checkbox" id="activityEnabled" checked>
                <label for="activityEnabled">Read active window title for context</label>
            </div>
        </div>
    </div>

    <div class="footer">
        <button onclick="saveSettings()">Save Settings</button>
        <div class="status" id="status"></div>
    </div>

    <script>
        async function loadSettings() {
            try {
                const config = await window.__TAURI_INTERNALS__.invoke('get_config');
                document.getElementById('region').value = config.aws_region;
                document.getElementById('modelId').value = config.model_id;
                document.getElementById('persona').value = config.persona;
                document.getElementById('interval').value = config.interval_minutes;
                document.getElementById('intervalDisplay').textContent = config.interval_minutes + ' min';
                document.getElementById('nicknames').value = config.nicknames.join(', ');
                document.getElementById('activityEnabled').checked = config.activity_enabled;
            } catch (e) {
                document.getElementById('status').textContent = 'Error loading: ' + e;
            }
        }

        async function saveSettings() {
            const config = {
                aws_region: document.getElementById('region').value,
                model_id: document.getElementById('modelId').value,
                persona: document.getElementById('persona').value,
                interval_minutes: parseInt(document.getElementById('interval').value),
                nicknames: document.getElementById('nicknames').value.split(',').map(s => s.trim()).filter(s => s),
                activity_enabled: document.getElementById('activityEnabled').checked,
            };
            try {
                await window.__TAURI_INTERNALS__.invoke('set_config', { config });
                document.getElementById('status').textContent = '✓ Saved!';
                setTimeout(() => { document.getElementById('status').textContent = ''; }, 2000);
            } catch (e) {
                document.getElementById('status').textContent = 'Error: ' + e;
            }
        }

        document.getElementById('interval').addEventListener('input', (e) => {
            document.getElementById('intervalDisplay').textContent = e.target.value + ' min';
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                window.__TAURI_INTERNALS__.invoke('plugin:window|hide', { label: 'settings' });
            }
        });

        loadSettings();
    </script>
</body>
</html>
