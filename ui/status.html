<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { background: #1a1a1a; font-family: monospace; height: 100%; overflow: hidden; }
        .card {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #1a1a1a;
            image-rendering: pixelated;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Title bar — solid background, stays on top */
        .titlebar {
            height: 52px;
            min-height: 52px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #1a1a1a;
            border-bottom: 1px solid #2a2a2a;
            position: relative;
            z-index: 10;
        }
        .titlebar h1 {
            font-size: 14px;
            font-weight: 600;
            color: #e8e4df;
            letter-spacing: -0.2px;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* Scrollable content area — everything below titlebar */
        .scroll-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }
        .scroll-content::-webkit-scrollbar { width: 4px; }
        .scroll-content::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }
        .scroll-content::-webkit-scrollbar-track { background: transparent; }

        /* Pixel scene */
        .scene {
            position: relative;
            height: 120px;
            background: #1a1a1a;
            overflow: hidden;
            cursor: grab;
        }
        .scene:active { cursor: grabbing; }
        .ground {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 2px;
            background: repeating-linear-gradient(90deg, #555 0px, #555 3px, transparent 3px, transparent 6px);
        }
        .star {
            position: absolute;
            color: #666;
            font-size: 14px;
            font-weight: bold;
            animation: twinkle 2s infinite alternate;
        }
        @keyframes twinkle { from { opacity: 0.3; } to { opacity: 1; } }

        /* Stats panel */
        .stats {
            padding: 20px 24px;
            background: #222;
        }
        .stat-row {
            display: flex;
            align-items: center;
            margin-bottom: 14px;
            gap: 12px;
        }
        .stat-row:last-child { margin-bottom: 0; }
        .stat-name { font-size: 15px; color: #999; width: 95px; font-weight: bold; }
        .stat-bar {
            flex: 1;
            height: 8px;
            background: #333;
            border-radius: 4px;
            overflow: hidden;
        }
        .stat-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.6s ease;
        }
        .stat-fill.happiness { background: #f5a623; }
        .stat-fill.energy { background: #4cd964; }
        .stat-fill.love { background: #ff4f9a; }
        .stat-val { font-size: 14px; color: #666; width: 30px; text-align: right; font-weight: bold; }

        /* How to level up */
        .tips {
            padding: 16px 22px;
            background: #1e1e1e;
            border-top: 1px solid #2a2a2a;
            font-size: 13px;
            color: #555;
            line-height: 2;
        }
        .tips-title { color: #999; font-size: 15px; font-weight: bold; }

        /* History Section */
        .history-section {
            background: #1a1a1a;
            border-top: 1px solid #2a2a2a;
        }
        .history-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 22px;
            cursor: pointer;
            user-select: none;
        }
        .history-header:hover { background: #222; }
        .history-title {
            font-size: 14px;
            font-weight: bold;
            color: #999;
        }
        .history-toggle {
            color: #666;
            font-size: 12px;
            transition: transform 0.2s;
        }
        .history-toggle.open { transform: rotate(180deg); }
        .history-list {
            max-height: 200px;
            overflow-y: auto;
            padding: 0 16px 12px;
        }
        .history-list::-webkit-scrollbar { width: 4px; }
        .history-list::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
        .history-empty {
            text-align: center;
            color: #555;
            font-size: 12px;
            padding: 16px 0;
        }
        .history-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 8px;
            border-bottom: 1px solid #2a2a2a;
            font-size: 12px;
        }
        .history-item:last-child { border-bottom: none; }
        .history-time { color: #555; font-size: 11px; min-width: 42px; }
        .history-source { color: #888; min-width: 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .history-detail { color: #aaa; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .history-delta { font-weight: 900; min-width: 36px; text-align: right; }
        .history-delta.pos { color: #4cd964; }
        .history-delta.neg { color: #ff6b6b; }
    </style>
</head>
<body>

    <script>
        async function loadStatus() {
            try {
                const s = await window.__TAURI_INTERNALS__.invoke('get_pet_status');
                document.getElementById('happinessVal').textContent = s.happiness;
                document.getElementById('happinessBar').style.width = s.happiness + '%';
                document.getElementById('energyVal').textContent = s.energy;
                document.getElementById('energyBar').style.width = s.energy + '%';
                document.getElementById('loveVal').textContent = s.love;
                document.getElementById('loveBar').style.width = s.love + '%';
            } catch(e) {}
        }

        let historyOpen = false;
        function toggleHistory() {
            historyOpen = !historyOpen;
            document.getElementById('historyList').style.display = historyOpen ? 'block' : 'none';
            document.getElementById('historyToggle').classList.toggle('open', historyOpen);
            if (historyOpen) loadHistory();
        }

        async function loadHistory() {
            try {
                const entries = await window.__TAURI_INTERNALS__.invoke('get_activity_log', { limit: 20 });
                const list = document.getElementById('historyList');
                const empty = document.getElementById('historyEmpty');

                if (!entries || entries.length === 0) {
                    empty.style.display = 'block';
                    return;
                }
                empty.style.display = 'none';

                let html = '';
                for (let i = entries.length - 1; i >= 0; i--) {
                    const e = entries[i];
                    const date = new Date(e.ts);
                    const time = date.getHours().toString().padStart(2,'0') + ':' + date.getMinutes().toString().padStart(2,'0');
                    const delta = e.delta;
                    const deltaStr = delta ? (delta > 0 ? '+' + delta : String(delta)) : '';
                    const deltaClass = delta ? (delta > 0 ? 'pos' : 'neg') : '';
                    html += `<div class="history-item">
                        <span class="history-time">${time}</span>
                        <span class="history-source">${escapeHtml(e.source)}</span>
                        <span class="history-detail">${escapeHtml(e.detail)}</span>
                        <span class="history-delta ${deltaClass}">${deltaStr}</span>
                    </div>`;
                }
                list.innerHTML = html + '<div class="history-empty" id="historyEmpty" style="display:none">No activity yet~</div>';
            } catch(e) {
                console.error('loadHistory error:', e);
            }
        }

        function escapeHtml(t) {
            if (!t) return '';
            const d = document.createElement('div');
            d.textContent = t;
            return d.innerHTML;
        }

        function hideStatus() {
            window.__TAURI_INTERNALS__.invoke('plugin:window|hide', { label: 'status' });
        }

        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideStatus(); });

        loadStatus();
        setInterval(loadStatus, 5000);
        setInterval(() => { if (historyOpen) loadHistory(); }, 30000);
    </script>
</body>
</html>
