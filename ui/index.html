<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            background: transparent;
            user-select: none;
            -webkit-user-select: none;
            width: 100%;
            height: 100%;
            cursor: grab;
            overflow: visible;
        }
        body:active { cursor: grabbing; }
        .container {
            position: absolute;
            bottom: 5px;
            left: 5px;
            display: flex;
            align-items: flex-end;
            gap: 0;
        }
        .pet {
            width: 200px;
            height: auto;
            image-rendering: pixelated;
            -webkit-user-drag: none;
            display: block;
            filter: drop-shadow(1px 0 0 black) drop-shadow(-1px 0 0 black) drop-shadow(0 1px 0 black) drop-shadow(0 -1px 0 black);
        }
        .bubble-wrapper {
            align-self: center;
            display: none;
            margin-left: -20px;
        }
        .bubble-wrapper.show { display: block; }
    </style>
</head>
<body data-tauri-drag-region="deep">
    <div class="container">
        <img class="pet" src="claude_meow.gif" draggable="false" id="pet">
        <div class="bubble-wrapper" id="bubble">
            <svg id="bubbleSvg" height="50" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:block;"></svg>
        </div>
    </div>

    <script>
        const invoke = window.__TAURI_INTERNALS__
            ? window.__TAURI_INTERNALS__.invoke
            : () => {};

        const nicknames = ['MeowMeow', '喵喵', '小猫', '晴晴', 'KatMeow', 'Meow'];
        function pickNick() {
            return nicknames[Math.floor(Math.random() * nicknames.length)];
        }

        const clickMessages = [
            '干嘛碰{n}！😾', '哎呀！别戳{n}！🐾', '喵！！疼！😿',
            '又碰{n}！不理你了！', '别摸了别摸了！🙀',
            '哼～再碰{n}咬你哦！', 'Stop poking {n}! 😤',
            '喵呜～{n}喜欢～😽', '再碰{n}就告诉Claude！'
        ];

        const fallbackMessages = [
            'HI! {n}来啦~', '{n}说：坐直啦！', '{n}：drink water~',
            '{n}：别喝Monster！', '{n}加油鸭～🦆', '{n}：摸鱼吗？🐟',
            '{n}：该休息了～', '{n} says Meow! 🐱', '{n}：别驼背！'
        ];

        function fillNick(msg) {
            return msg.replace(/\{n\}/g, pickNick());
        }

        function createPixelBubbleSVG(text) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            ctx.font = 'bold 13px monospace';
            const textWidth = ctx.measureText(text).width;
            const boxWidth = Math.max(textWidth + 20, 50);
            const boxHeight = 32;
            const svgWidth = boxWidth + 6;
            const totalHeight = boxHeight + 14;

            return `<svg width="${svgWidth}" height="${totalHeight}" viewBox="0 0 ${svgWidth} ${totalHeight}" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:block;">
                <rect x="3" y="3" width="${boxWidth}" height="${boxHeight}" fill="white"/>
                <rect x="3" y="0" width="${boxWidth}" height="3" fill="black"/>
                <rect x="3" y="${boxHeight + 3}" width="${boxWidth}" height="3" fill="black"/>
                <rect x="0" y="3" width="3" height="${boxHeight}" fill="black"/>
                <rect x="${boxWidth + 3}" y="3" width="3" height="${boxHeight}" fill="black"/>
                <rect x="0" y="${boxHeight + 3}" width="3" height="3" fill="black"/>
                <rect x="-3" y="${boxHeight}" width="3" height="3" fill="black"/>
                <rect x="-6" y="${boxHeight - 3}" width="3" height="3" fill="black"/>
                <rect x="-3" y="${boxHeight - 3}" width="3" height="3" fill="white"/>
                <rect x="0" y="${boxHeight}" width="3" height="3" fill="white"/>
                <text x="${svgWidth / 2}" y="${boxHeight / 2 + 8}" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="black">${text}</text>
            </svg>`;
        }

        function showBubble(text) {
            const wrapper = document.getElementById('bubble');
            const svg = document.getElementById('bubbleSvg');
            svg.outerHTML = createPixelBubbleSVG(text);
            wrapper.classList.add('show');
            clearTimeout(window._bubbleTimeout);
            window._bubbleTimeout = setTimeout(() => {
                wrapper.classList.remove('show');
            }, 120000);
        }

        document.getElementById('pet').addEventListener('dblclick', (e) => {
            e.stopPropagation();
            const msg = fillNick(clickMessages[Math.floor(Math.random() * clickMessages.length)]);
            showBubble(msg);
        });

        async function generateAIMessage() {
            try {
                const config = await invoke('get_config');
                let context = 'User is at their computer';
                if (config.activity_enabled) {
                    try {
                        context = await invoke('get_active_window');
                    } catch (e) {
                        context = 'Unknown activity';
                    }
                }
                const message = await invoke('generate_message', { context });
                showBubble(message);
            } catch (e) {
                const msg = fillNick(fallbackMessages[Math.floor(Math.random() * fallbackMessages.length)]);
                showBubble(msg);
            }
        }

        showBubble(fillNick(fallbackMessages[Math.floor(Math.random() * fallbackMessages.length)]));

        async function startLoop() {
            try {
                const config = await invoke('get_config');
                const intervalMs = (config.interval_minutes || 5) * 60 * 1000;
                setTimeout(generateAIMessage, 10000);
                setInterval(generateAIMessage, intervalMs);
            } catch (e) {
                setInterval(() => {
                    const msg = fillNick(fallbackMessages[Math.floor(Math.random() * fallbackMessages.length)]);
                    showBubble(msg);
                }, 300000);
            }
        }

        startLoop();
    </script>
</body>
</html>
