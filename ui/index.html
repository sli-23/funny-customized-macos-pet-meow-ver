<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        @font-face {
            font-family: 'Pixel';
            src: url('assets/pixel-font.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }
    </style>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            background: transparent;
            user-select: none;
            -webkit-user-select: none;
            width: 100%;
            height: 100%;
            cursor: grab;
            overflow: visible;
        }
        body:active { cursor: grabbing; }
        .container {
            position: absolute;
            bottom: 3px;
            left: 5px;
            display: flex;
            align-items: flex-end;
            gap: 0;
        }
        .pet {
            width: 150px;
            height: auto;
            image-rendering: pixelated;
            -webkit-user-drag: none;
            display: block;
            padding-bottom: 2px;
            filter: drop-shadow(1px 0 0 black) drop-shadow(-1px 0 0 black) drop-shadow(0 1px 0 black) drop-shadow(0 -1px 0 black);
        }
        @media (prefers-color-scheme: dark) {
            .pet {
                filter: drop-shadow(1px 0 0 white) drop-shadow(-1px 0 0 white) drop-shadow(0 1px 0 white) drop-shadow(0 -1px 0 white);
            }
        }
        .pet:hover { cursor: pointer; }
        .pet.bounce {
            animation: petBounce 0.4s ease;
        }
        .pet.shake {
            animation: petShake 0.5s ease;
        }
        .pet.wiggle {
            animation: petWiggle 0.6s ease;
        }
        @keyframes petBounce {
            0%, 100% { transform: translateY(0); }
            30% { transform: translateY(-12px); }
            60% { transform: translateY(-4px); }
        }
        @keyframes petShake {
            0%, 100% { transform: rotate(0deg); }
            20% { transform: rotate(-8deg); }
            40% { transform: rotate(8deg); }
            60% { transform: rotate(-5deg); }
            80% { transform: rotate(5deg); }
        }
        @keyframes petWiggle {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-3px); }
            80% { transform: translateX(3px); }
        }
        .bubble-wrapper {
            align-self: center;
            display: none;
            margin-left: -15px;
        }
        .bubble-wrapper.show { display: block; }
        .bubble-wrapper.pop .pixel-bubble {
            animation: bubblePop 0.3s ease;
        }
        @keyframes bubblePop {
            0% { transform: scale(0.7); opacity: 0.5; }
            60% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pixel-bubble {
            position: relative;
            background: white;
            border: 3px solid black;
            padding: 0;
            margin-left: 12px;
            font-family: monospace;
            font-size: 13px;
            font-weight: bold;
            color: black;
            transition: transform 0.1s;
            max-width: 250px;
            min-width: 40px;
            overflow: visible;
            image-rendering: pixelated;
        }
        .pixel-bubble-inner {
            padding: 6px 10px;
            max-height: 72px;
            overflow-y: auto;
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: pre-wrap;
            line-height: 1.4;
        }
        .pixel-bubble-inner::-webkit-scrollbar { width: 3px; }
        .pixel-bubble-inner::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 2px; }
        /* Pixel staircase tail pointing left toward pet */
        .pixel-bubble::before,
        .pixel-bubble::after { content: ''; position: absolute; }
        .pixel-bubble::before {
            left: -9px;
            top: 50%;
            margin-top: -1px;
            width: 0; height: 0;
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
            border-right: 9px solid black;
        }
        .pixel-bubble::after {
            left: -5px;
            top: 50%;
            margin-top: 1px;
            width: 0; height: 0;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
            border-right: 6px solid white;
        }
        .pixel-bubble.chat-reply {
            border-color: #c25b28;
            background: #fdf8f4;
        }
        .pixel-bubble.chat-reply::before {
            border-right-color: #c25b28;
        }
        .pixel-bubble.chat-reply::after {
            border-right-color: #fdf8f4;
        }
        .chat-input-wrapper {
            position: absolute;
            bottom: 5px;
            left: 150px;
            display: none;
            z-index: 10;
        }
        .chat-input-wrapper.show { display: flex; align-items: center; gap: 4px; }
        .chat-input-wrapper { -webkit-user-select: auto; user-select: auto; }
        .chat-input {
            width: 180px;
            padding: 6px 10px;
            border: 3px solid black;
            background: white;
            font-family: monospace;
            font-size: 12px;
            font-weight: bold;
            outline: none;
            image-rendering: pixelated;
            -webkit-user-select: auto;
            user-select: auto;
        }
        .chat-input::placeholder { color: #999; }

        /* ── Floating Numbers ── */
        .float-numbers {
            position: absolute;
            bottom: 75px;
            left: 30px;
            width: 90px;
            pointer-events: none;
        }
        .float-num {
            position: absolute;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
            font-family: 'Pixel', monospace;
            font-size: 11px;
            font-weight: normal;
            animation: floatUp 1.2s ease-out forwards;
            pointer-events: none;
            image-rendering: pixelated;
            -webkit-font-smoothing: none;
        }
        .float-num.positive { color: #2d8f3e; }
        .float-num.negative { color: #ff6b6b; }
        .float-num.neutral { color: #5ac8fa; }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateX(-50%) translateY(0); }
            75% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) translateY(-18px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="float-numbers" id="floatNumbers"></div>
        <img class="pet" src="assets/claude_meow.gif" draggable="false" id="pet" data-tauri-drag-region>
        <div class="bubble-wrapper" id="bubble">
        </div>
        <div class="chat-input-wrapper" id="chatWrapper">
            <input class="chat-input" id="chatInput" type="text" placeholder="Talk to me~" maxlength="100">
        </div>
    </div>

    <script>
        // ── Tauri bridge ──
        function invoke(cmd, args) {
            if (window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke) {
                return window.__TAURI_INTERNALS__.invoke(cmd, args);
            }
            return Promise.reject('Tauri not ready');
        }

        // ── Helpers ──
        let nicknames = ['人类', 'hooman', '铲屎官', '主人', 'buddy'];
        let userNickname = '';
        let secretMessages = [];
        const kaomojis = [
            '^ↀᴥↀ^', 'ฅ•ω•ฅ', '(ฅ\'ω\'ฅ)', '(=ↀωↀ=)', '=^∇^*=',
            '(^･ｪ･^)', '(=^･^=)', '(^・ω・^ )', '(=^-ω-^=)', '(^=◕ᴥ◕=^)',
            '(＾• ω •＾)', 'ฅ(•ㅅ•❀)ฅ', '(=^ ◡ ^=)', '(=^･ω･^=)',
            '<(*ΦωΦ*)>', '(^˵◕ω◕˵^)', '~(=^‥^)/', 'ଲ(ⓛ ω ⓛ)ଲ',
        ];
        function pickNick() {
            if (userNickname) return userNickname;
            return nicknames[Math.floor(Math.random() * nicknames.length)];
        }
        function fillNick(msg) { return msg.replace(/\{n\}/g, pickNick()).replace(/\{k\}/g, pickKao()); }
        function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
        function pickKao() { return pick(kaomojis); }
        function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

        // ── Message pools ──
        const tapMessages = [
            '喵？🐱', '嗯？', '哎～', '呜～', 'meow~',
            '嘻嘻～😸', '喵呜!', '♪～', '哼!', 'nya~',
            '摸摸～🐾', '嗷呜?', '...💤', '嘿!', '~喵',
        ];
        const pokeMessages = [
            '别碰我！😾', '哎呀！别戳{n}！🐾', '喵！！疼！😿',
            '又戳！不理你了！💢', '别摸了别摸了！🙀',
            '哼～再碰咬你哦！😤', '手拿开！是{n}的毛！',
            '喵呜～{n}其实喜欢～😽', '再碰就告诉Claude！🤖',
            '你好烦！但{n}原谅你～', '讨厌！才不疼呢…😿',
            '呜呜～{n}被欺负了！', '轻点！{n}很娇贵的！✨',
            '啊！{n}的尾巴！🙀', '你完了！{n}记仇的！📝',
            '{n}不是玩具！哼！', '痒痒～哈哈别挠！😹',
            '好啦好啦～摸一下而已嘛', '喵喵喵！投降！🏳️',
        ];
        const fallbackMessages = [
            'HI! {n}来啦~ {k}', '{n}, 坐直啦！{k}', '{n}, drink water~ {k}',
            '{n}, 别喝Monster！🚫', '{n}, 加油鸭～{k}', '{n}, 摸鱼吗？🐟',
            '{n}, 该休息了～{k}', '{n}, Meow! {k}', '{n}, 别驼背！{k}',
            '{n}, Monster放下！喝水！💧', '{n}, 又偷喝Monster了？😾',
            '{n}, 喝水喝水喝水！💧{k}',
        ];

        // Activity-specific fallback messages (when AI fails)
        const activityFallbacks = {
            coding: [
                '{n}, 写代码呢！加油～💪', '{n}, bug写完了吗？😸',
                '{n}, 代码写累了喝口水～', '{n}, coding好认真！🐱',
            ],
            social: [
                '{n}, 又在摸鱼！🐟', '{n}, 我看到你在刷手机～',
                '{n}, 别看了！回来工作！😾', '{n}, 摸鱼被我抓到了！',
            ],
            communication: [
                '{n}, 在聊天呢！为什么不找我！😿', '{n}, Slack里打字呢～',
                '{n}, 跟谁聊呢？我也要！', '{n}, 开会辛苦了～🐱',
            ],
            browsing: [
                '{n}, 在看什么呢？👀', '{n}, 上网冲浪中～🏄',
                '{n}, 浏览器开了好多tab吧！', '{n}, 别逛了来陪我！',
            ],
            typing: [
                '{n}, 打字好快！🐾', '{n}, 噼里啪啦打字中～',
                '{n}, 手指不累吗？休息下～', '{n}, 在写什么呀？好好奇！',
            ],
        };

        function getActivityFallback(context) {
            const lower = (context || '').toLowerCase();
            let pool = fallbackMessages;
            if (lower.includes('[typing]')) pool = activityFallbacks.typing;
            else if (lower.includes('coding')) pool = activityFallbacks.coding;
            else if (lower.includes('social') || lower.includes('slacking')) pool = activityFallbacks.social;
            else if (lower.includes('communication')) pool = activityFallbacks.communication;
            else if (lower.includes('browsing')) pool = activityFallbacks.browsing;
            return fillNick(pick(pool));
        }

        // ── Animation ──
        const petEl = document.getElementById('pet');
        const anims = ['bounce', 'shake', 'wiggle'];
        function playAnim() {
            const a = pick(anims);
            petEl.classList.remove(...anims);
            void petEl.offsetWidth;
            petEl.classList.add(a);
            setTimeout(() => petEl.classList.remove(a), 700);
        }

        // ── DOM refs ──
        const bubbleEl = document.getElementById('bubble');
        const chatWrapper = document.getElementById('chatWrapper');
        const chatInput = document.getElementById('chatInput');

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // MESSAGE SCHEDULER — priority-based channels
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const scheduler = {
            channel: null,
            timers: {},
            modules: [],

            clearTimers() {
                Object.values(this.timers).forEach(clearTimeout);
                this.timers = {};
            },

            show(text, opts) {
                const cls = (opts && opts.cls) ? ' ' + opts.cls : '';
                bubbleEl.innerHTML = `<div class="pixel-bubble${cls}"><div class="pixel-bubble-inner">${escapeHtml(text)}</div></div>`;
                bubbleEl.classList.remove('pop');
                bubbleEl.classList.add('show');
                if (opts && opts.animate) {
                    void bubbleEl.offsetWidth;
                    bubbleEl.classList.add('pop');
                }
            },

            hide() {
                bubbleEl.classList.remove('show', 'pop');
                this.channel = null;
            },

            // ── Channel: Touch (highest priority) ──
            onTouch(text) {
                this.clearTimers();
                this.channel = 'touch';
                this.show(text, { animate: true });
                this.timers.touchIdle = setTimeout(() => {
                    this.timers.hide = setTimeout(() => {
                        this.hide();
                        this.timers.next = setTimeout(() => this.nextIdle(), this.idleGapMs || 180000);
                    }, 30000);
                }, 5000);
            },

            // ── Channel: Chat (user-initiated) ──
            onChat(text) {
                this.clearTimers();
                this.channel = 'chat';
                this.show(text, { cls: 'chat-reply' });
                invoke('emit_dev_log', { tag: 'BUBBLE', tagClass: 'reaction', message: '[chat] "' + text + '"' }).catch(() => {});
                this.timers.hide = setTimeout(() => {
                    this.hide();
                    this.timers.next = setTimeout(() => this.nextIdle(), this.idleGapMs || 180000);
                }, 30000);
            },

            // ── Channel: Activity (AI auto-generated) ──
            onActivity(text) {
                this.clearTimers();
                this.channel = 'activity';
                this.show(text);
                invoke('emit_dev_log', { tag: 'BUBBLE', tagClass: 'event', message: '[activity] "' + text + '"' }).catch(() => {});
                this.timers.hide = setTimeout(() => {
                    this.hide();
                    this.timers.next = setTimeout(() => this.nextIdle(), this.idleGapMs || 180000);
                }, 30000);
            },

            // ── Channel: Module ──
            onModule(text) {
                this.clearTimers();
                this.channel = 'module';
                this.show(text);
                invoke('emit_dev_log', { tag: 'BUBBLE', tagClass: 'url', message: '[module] "' + text + '"' }).catch(() => {});
                this.timers.hide = setTimeout(() => {
                    this.hide();
                    this.timers.next = setTimeout(() => this.nextIdle(), this.idleGapMs || 180000);
                }, 30000);
            },

            // ── Idle cycle brain ──
            async nextIdle() {
                if (this.channel === 'touch' || this.channel === 'chat') return;

                // Try each due module — skip if it returns null
                for (const mod of this.modules) {
                    const now = Date.now();
                    let interval;
                    if (mod.frequency === 'daily') interval = 86400000;
                    else if (mod.frequency === 'hourly') interval = 3600000;
                    else interval = (mod.intervalMinutes || 30) * 60000;
                    if (now - (mod.lastRun || 0) < interval) continue;

                    try {
                        const msg = await mod.getMessage();
                        mod.lastRun = Date.now();
                        try { localStorage.setItem('mod_' + mod.id, String(mod.lastRun)); } catch(e) {}
                        if (msg) {
                            invoke('emit_dev_log', { tag: 'MOD', tagClass: 'url', message: 'built-in "' + mod.id + '" fired: "' + msg.slice(0,50) + '"' }).catch(() => {});
                            this.onModule(msg);
                            return;
                        }
                    } catch(e) { /* skip this module */ }
                }
                invoke('emit_dev_log', { tag: 'IDLE', tagClass: 'skip', message: 'no built-in module due, calling AI...' }).catch(() => {});
                await this.runActivity();
            },

            async runActivity() {
                // AI activity is lowest system priority — don't fire if module reaction is showing
                if (this.channel === 'module') {
                    invoke('emit_dev_log', { tag: 'AI', tagClass: 'skip', message: 'skipped — module reaction active' }).catch(() => {});
                    return;
                }
                let context = 'User is at their computer';
                try {
                    context = await invoke('get_activity_context');
                } catch(e) {}
                try {
                    const message = await invoke('generate_message', { context });
                    invoke('emit_dev_log', { tag: 'AI', tagClass: 'reaction', message: 'activity msg: "' + message + '" ctx: ' + context.slice(0, 60) }).catch(() => {});
                    this.onActivity(message);
                } catch(e) {
                    const fb = getActivityFallback(context);
                    invoke('emit_dev_log', { tag: 'AI', tagClass: 'skip', message: 'fallback msg: "' + fb + '"' }).catch(() => {});
                    this.onActivity(fb);
                }
            },

            // ── Module registry ──
            registerModule(config) {
                const saved = parseInt(localStorage.getItem('mod_' + config.id)) || 0;
                config.lastRun = saved;
                this.modules.push(config);
            },

            getNextDueModule() {
                const now = Date.now();
                for (const m of this.modules) {
                    let interval;
                    if (m.frequency === 'daily') interval = 86400000;
                    else if (m.frequency === 'hourly') interval = 3600000;
                    else interval = (m.intervalMinutes || 30) * 60000;
                    if (now - (m.lastRun || 0) >= interval) return m;
                }
                return null;
            },

            // ── Boot ──
            async start() {
                try {
                    const config = await invoke('get_config');
                    this.idleGapMs = (config.interval_minutes || 3) * 60 * 1000;
                } catch(e) {
                    this.idleGapMs = 180000;
                }
                // Show a quick greeting, then trigger first real activity message after 15s
                this.onActivity(fillNick(pick(fallbackMessages)));
                setTimeout(() => this.runActivity(), 15000);
            }
        };

        // ━━━━━━━━━━━━━━━━━━━━━━
        // REGISTER MODULES
        // ━━━━━━━━━━━━━━━━━━━━━━

        // Weather — once daily, real data from wttr.in
        scheduler.registerModule({
            id: 'weather',
            frequency: 'daily',
            getMessage: async () => {
                const ctx = await invoke('get_all_context');
                if (!ctx.weather || ctx.weather.includes('unavailable')) return null;
                const reply = await invoke('generate_message', { context: ctx.weather });
                return reply;
            }
        });

        // Spotify — every hour, comment on music
        scheduler.registerModule({
            id: 'spotify',
            frequency: 'hourly',
            getMessage: async () => {
                const ctx = await invoke('get_all_context');
                if (!ctx.spotify || ctx.spotify.includes('not running')) return null;
                const reply = await invoke('generate_message', { context: ctx.spotify });
                return reply;
            }
        });

        // Battery — every 15 min, warn if low
        scheduler.registerModule({
            id: 'battery',
            intervalMinutes: 15,
            getMessage: async () => {
                const ctx = await invoke('get_all_context');
                if (ctx.system) {
                    const match = ctx.system.match(/(\d+)%/);
                    if (match && parseInt(match[1]) < 20) {
                        return fillNick('{n}, 电量只有' + match[1] + '%了！快充电！🔋');
                    }
                }
                return null;
            }
        });

        // Quotes (励志句子) — every 2 hours, from hitokoto.cn
        scheduler.registerModule({
            id: 'quotes',
            frequency: 'hourly',
            getMessage: async () => {
                const ctx = await invoke('get_all_context');
                if (ctx.quotes) return fillNick('{n}, ') + ctx.quotes;
                return null;
            }
        });

        // Zoom — every 10 min, check if in meeting
        scheduler.registerModule({
            id: 'zoom',
            intervalMinutes: 10,
            getMessage: async () => {
                const ctx = await invoke('get_all_context');
                if (!ctx.zoom || ctx.zoom.includes('not running')) return null;
                if (ctx.zoom.includes('in a meeting')) {
                    return fillNick(pick([
                        '{n}, 开会辛苦了！加油～🐱',
                        '{n}, 在开会呢！我安静等你～',
                        '{n}, meeting中！记得喝水～',
                        '{n}, 开完会来找我玩！😸',
                    ]));
                }
                return null;
            }
        });

        // Performance — every 5 min, warn if CPU/RAM overloaded
        scheduler.registerModule({
            id: 'performance',
            intervalMinutes: 5,
            getMessage: async () => {
                const ctx = await invoke('get_all_context');
                if (ctx.performance && ctx.performance.includes('WARNING')) {
                    const reply = await invoke('generate_message', {
                        context: ctx.performance + '\nWarn the user their laptop is overloaded! Use words like 超载, 太热了, 要爆炸了'
                    });
                    return reply;
                }
                return null;
            }
        });

        // ━━━━━━━━━━━━━━━━━━━━━━
        // TOUCH HANDLERS (with rage detection)
        // ━━━━━━━━━━━━━━━━━━━━━━
        let clickTimer = null;
        let tapCount = 0;
        let tapResetTimer = null;
        const angryMessages = [
            '够了！！！别碰我！！😡🔥 {k}',
            '你有完没完！！！💢💢💢',
            '再碰一下试试！！！(=`ω´=)凸',
            '暴怒模式启动！！！🐱‍👤💢',
            '我要咬人了！！！啊啊啊！😾💢',
            'STOP IT!!! I WILL BITE!!! 💢{k}',
            '你是不是皮痒了！！！(=｀ェ´=)',
            '够了够了够了！！！炸毛了！！🙀💥',
        ];

        petEl.addEventListener('click', (e) => {
            e.stopPropagation();
            playAnim();
            tapCount++;
            clearTimeout(tapResetTimer);
            tapResetTimer = setTimeout(() => { tapCount = 0; }, 3000);

            clearTimeout(clickTimer);
            clickTimer = setTimeout(async () => {
                if (tapCount >= 5) {
                    scheduler.onTouch(fillNick(pick(angryMessages)));
                    invoke('pet_angry').catch(() => {});
                    invoke('context_on_rage').catch(() => {});
                    invoke('log_status_change', { source: 'touch', detail: 'rage tap (5x)', delta: -15 }).catch(() => {});
                    invoke('emit_dev_log', { tag: 'TOUCH', tagClass: 'error', message: 'rage tap (5x) happiness -15' }).catch(() => {});
                    showFloatingNumber(-15);
                    tapCount = 0;
                } else {
                    scheduler.onTouch(pick(tapMessages));
                    invoke('pet_touched').catch(() => {});
                    invoke('log_status_change', { source: 'touch', detail: 'pet touched', delta: 3 }).catch(() => {});
                    invoke('emit_dev_log', { tag: 'TOUCH', tagClass: 'event', message: 'pet tapped happiness +3' }).catch(() => {});
                    showFloatingNumber(+3);
                }
            }, 250);
        });

        petEl.addEventListener('dblclick', (e) => {
            e.stopPropagation();
            clearTimeout(clickTimer);
            playAnim();
            scheduler.onTouch(fillNick(pick(pokeMessages)));
            invoke('pet_touched').catch(() => {});
            invoke('log_status_change', { source: 'touch', detail: 'pet poked', delta: 3 }).catch(() => {});
            invoke('emit_dev_log', { tag: 'TOUCH', tagClass: 'event', message: 'pet double-tapped happiness +3' }).catch(() => {});
            showFloatingNumber(+3);
        });

        // ━━━━━━━━━━━━━━━━━━━━━━
        // CHAT (Ctrl+Cmd+C)
        // ━━━━━━━━━━━━━━━━━━━━━━
        function openChat() {
            bubbleEl.classList.remove('show');
            chatWrapper.classList.add('show');
            chatInput.value = '';
            setTimeout(() => chatInput.focus(), 50);
        }
        function closeChat() {
            chatWrapper.classList.remove('show');
            chatInput.blur();
        }

        if (window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.transformCallback) {
            window.__TAURI_INTERNALS__.invoke('plugin:event|listen', {
                event: 'open-chat',
                target: { kind: 'Any' },
                handler: window.__TAURI_INTERNALS__.transformCallback(() => openChat())
            });
        }

        async function submitChat() {
            const text = chatInput.value.trim();
            if (!text) return;
            closeChat();
            scheduler.onChat('thinking~🤔');
            try {
                const reply = await invoke('chat_message', { userText: text });
                scheduler.onChat(reply || fillNick('{n}：...嗯？🤔'));
                invoke('pet_chatted').catch(() => {});
                invoke('context_on_chat').catch(() => {});
                invoke('log_status_change', { source: 'chat', detail: 'chatted with pet', delta: 5 }).catch(() => {});
                invoke('emit_dev_log', { tag: 'CHAT', tagClass: 'reaction', message: 'user chatted: "' + text + '" → happiness +5, love +5' }).catch(() => {});
                showFloatingNumber(+5);
            } catch(err) {
                scheduler.onChat('Error: ' + String(err).slice(0, 60));
            }
        }

        chatInput.addEventListener('keydown', (e) => {
            e.stopPropagation();
            if (e.key === 'Escape') closeChat();
        });
        chatInput.addEventListener('keypress', (e) => {
            e.stopPropagation();
            if (e.key === 'Enter') { e.preventDefault(); submitChat(); }
        });
        chatInput.addEventListener('mousedown', (e) => e.stopPropagation());
        chatInput.addEventListener('click', (e) => { e.stopPropagation(); chatInput.focus(); });

        // ━━━━━━━━━━━━━━━━━━━━━━
        // TYPING & TIME WATCHER (lightweight, runs every 30s)
        // ━━━━━━━━━━━━━━━━━━━━━━
        let lastTypingAlert = 0;
        let lastTimeAlert = {};

        setInterval(async () => {
            // Don't interrupt touch or chat, but CAN interrupt idle gap
            if (scheduler.channel === 'touch' || scheduler.channel === 'chat') return;
            // Don't fire if a message is currently visible
            if (scheduler.channel === 'activity' || scheduler.channel === 'module') return;

            try {
                const ctx = await invoke('get_activity_context');
                const now = Date.now();

                // Typing detection — at most once per 15 min
                if (ctx.includes('[typing]') && now - lastTypingAlert > 900000) {
                    lastTypingAlert = now;
                    scheduler.onActivity(getActivityFallback(ctx));
                    return;
                }

                // Time-based greetings — each slot fires only once
                const hour = new Date().getHours();
                let timeMsg = null;
                let slot = null;

                if ((hour >= 23 || hour < 5) && now - (lastTimeAlert.night || 0) > 21600000) {
                    slot = 'night';
                    timeMsg = pick([
                        '{n}, 都这么晚了！早点休息吧～ {k}',
                        '{n}, 猫猫困了...晚安～ {k}',
                        '{n}, 别熬夜了！🌙 {k}',
                    ]);
                } else if (hour >= 9 && hour < 10 && now - (lastTimeAlert.morning || 0) > 43200000) {
                    slot = 'morning';
                    timeMsg = pick([
                        '{n}, 早上好！打工人加油～☀️ {k}',
                        '{n}, good morning! {k}',
                        '{n}, 早！记得吃早餐哦～ {k}',
                    ]);
                } else if (hour === 12 && now - (lastTimeAlert.lunch || 0) > 43200000) {
                    slot = 'lunch';
                    timeMsg = pick([
                        '{n}, 午饭时间到！去吃饭！🍚 {k}',
                        '{n}, 12点了！该吃lunch了～ {k}',
                        '{n}, 别忘了吃午饭！{k}',
                    ]);
                } else if (hour >= 18 && hour < 19 && now - (lastTimeAlert.evening || 0) > 43200000) {
                    slot = 'evening';
                    timeMsg = pick([
                        '{n}, 下班了！该回家了！🏠 {k}',
                        '{n}, 收工收工！回家撸猫！{k}',
                    ]);
                }
                if (timeMsg && slot) {
                    lastTimeAlert[slot] = now;
                    scheduler.onActivity(fillNick(timeMsg));
                    return;
                }
            } catch(e) {}
        }, 60000);

        // ━━━━━━━━━━━━━━━━━━━━━━
        // FLOATING NUMBERS
        // ━━━━━━━━━━━━━━━━━━━━━━
        const floatContainer = document.getElementById('floatNumbers');
        let floatCount = 0;

        function showFloatingNumber(delta) {
            if (delta === 0) return;
            if (floatCount >= 5) return;

            const el = document.createElement('div');
            el.className = 'float-num ' + (delta > 0 ? 'positive' : delta < 0 ? 'negative' : 'neutral');
            el.textContent = (delta > 0 ? '+' : '') + delta;
            el.style.bottom = (floatCount * 20) + 'px';

            floatContainer.appendChild(el);
            floatCount++;

            setTimeout(() => {
                el.remove();
                floatCount--;
            }, 1200);
        }

        // ━━━━━━━━━━━━━━━━━━━━━━
        // RUNTIME EVENT LISTENER
        // ━━━━━━━━━━━━━━━━━━━━━━
        if (window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.transformCallback) {
            window.__TAURI_INTERNALS__.invoke('plugin:event|listen', {
                event: 'module-reaction',
                target: { kind: 'Any' },
                handler: window.__TAURI_INTERNALS__.transformCallback((event) => {
                    const data = event.payload;
                    if (data && data.message) {
                        if (scheduler.channel === 'touch' || scheduler.channel === 'chat') {
                            invoke('emit_dev_log', { tag: 'BLOCK', tagClass: 'skip', message: 'module reaction blocked (channel=' + scheduler.channel + '): "' + data.message + '"' }).catch(() => {});
                            return;
                        }
                        playAnim();
                        scheduler.onModule(data.message);
                    }
                })
            });

            window.__TAURI_INTERNALS__.invoke('plugin:event|listen', {
                event: 'pet-status-changed',
                target: { kind: 'Any' },
                handler: window.__TAURI_INTERNALS__.transformCallback((event) => {
                    const data = event.payload;
                    if (data && data.delta) {
                        showFloatingNumber(data.delta);
                    }
                })
            });
        }

        // ━━━━━━━━━━━━━━━━━━━━━━
        // LOAD .meow PROFILE + START
        // ━━━━━━━━━━━━━━━━━━━━━━
        (async () => {
            try {
                const config = await invoke('get_config');
                if (config.user_nickname) {
                    userNickname = config.user_nickname;
                }
                if (config.nicknames && config.nicknames.length > 0) {
                    nicknames = config.nicknames;
                }
            } catch(e) {}
            try {
                const meow = await invoke('get_meow_profile');
                if (meow) {
                    if (meow.nicknames && meow.nicknames.length > 0) {
                        nicknames = meow.nicknames;
                    }
                    if (meow.secret_messages && meow.secret_messages.length > 0) {
                        secretMessages = meow.secret_messages;
                        scheduler.registerModule({
                            id: 'secret',
                            frequency: 'hourly',
                            getMessage: async () => pick(secretMessages)
                        });
                    }
                }
            } catch(e) {}
            scheduler.start();
        })();
    </script>
</body>
</html>
