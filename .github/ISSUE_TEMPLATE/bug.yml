name: Bug Report
description: Report a bug in ClaudeMeow
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: Describe the bug
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened?
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ClaudeMeow
        2. Do X
        3. See error
  - type: input
    id: version
    attributes:
      label: ClaudeMeow version
      placeholder: e.g. 1.3.2
  - type: input
    id: os
    attributes:
      label: macOS version
      placeholder: e.g. Sonoma 14.5
