name: Feature Request
description: Suggest a new feature or module
labels: [enhancement]
body:
  - type: textarea
    id: description
    attributes:
      label: What would you like?
      placeholder: Describe the feature
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      placeholder: Why do you want this? What problem does it solve?
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - New module (reaction pack)
        - New AI behavior
        - UI improvement
        - Integration (Spotify, Slack, etc.)
        - Other
